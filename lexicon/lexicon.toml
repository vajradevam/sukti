# Sūkti lexicon — the single source of truth for keywords, roles, types and
# diagnostics. This file is data, not code: corrections need no compiler change.
# Every entry carries a grammatical status; nothing here claims scholar approval.

[meta]
name = "Sūkti"
name_itrans = "sUkti"
cli = "sukti"
version = "0.1.0"
script = "itrans"
file_extensions = ["sukti", "sk"]

# ---------------------------------------------------------------------------
# Keywords / vocabulary. pos = part of speech and inflection; root = dhātu.
# status ∈ {validated-by-tool, pending-scholar-review, scholar-approved}.
# "validated-by-tool" means transliteration/normalisation round-tripped with
# vidyut-lipi; it does NOT claim grammatical approval by a scholar.
# ---------------------------------------------------------------------------

[[entry]]
id = "let"
canonical = "astu"
iast = "astu"
kind = "keyword"
pos = "imperative active 3sg of √as (as, 'to be')"
root = "as"
gloss_en = "let it be; introduce a mutable binding"
gloss_sa = "bhavatu; parivartanIyaM bandhanaM sthApayati"
aliases = ["bhavatu"]
status = "pending-scholar-review"
rationale = "Classic optative/imperative 'let it be' — a natural existential binding word."
alternatives = ["bhavatu", "tiShThatu"]

