en = "clause shadows an earlier ungated general rule; the earlier clause is unreachable"
sa = "ayaM pakShaH pUrvasya utsargasya chhAyAm AchchhAdayati; pUrvapakShaH aprayojyaH"
hi = "yaha clause pahale ke binA sharta sAmAnya niyama ko chhAyAdatA hai; pahalA clause aprayojya hai"
