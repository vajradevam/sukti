[workspace]
resolver = "2"
members = [
    "crates/sanskrit",
    "crates/sukti",
    "crates/jit",
    "crates/lsp",
    "crates/wasm",
    "crates/bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
num-bigint = "0.5"
cranelift-codegen = "0.138.0-rc.1"
cranelift-frontend = "0.138.0-rc.1"
cranelift-jit = "0.138.0-rc.1"
cranelift-module = "0.138.0-rc.1"
cranelift-native = "0.138.0-rc.1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = false
